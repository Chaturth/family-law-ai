.advanced{margin:16px 0 4px;border:1px solid var(--bd);border-radius:10px;padding:0 12px;background:#fafcfb}.advanced summary{cursor:pointer;padding:11px 0;color:var(--acc);font-weight:650;font-size:12px}.advanced textarea{background:#fff}
.disclaimer-note{font-size:11px;color:var(--mut);margin-top:12px}.check-row{display:flex;gap:18px;flex-wrap:wrap;padding:10px 0}.check-row label{display:flex;align-items:center;gap:7px;margin:0;font-size:12px;font-weight:550}.check-row input{accent-color:var(--acc)}

:190px}.go,.alt{min-height:42px}textarea{font-size:14px}}
.nav-short{display:none}

/* Refined visual system */
:root{color-scheme:light;--bg:#f4f7f6;--card:#fff;--ink:#172a31;--mut:#71818a;--acc:#197769;--acc-dark:#125b53;--gold:#e5b96f;--ok:#21805e;--warn:#a86a20;--bad:#b74643;--bd:#e5ece9;--soft:#eaf4f1;--shadow:0 12px 32px rgba(27,52,48,.055);--shadow-hover:0 20px 46px rgba(27,52,48,.105)}
body{background:radial-gradient(ellipse at 82% 0%,#e7f2ef 0,transparent 36%),var(--bg);color:var(--ink);font-size:14px;line-height:1.6}
.app-shell{grid-template-columns:264px minmax(0,1fr)}
.sidebar{background:linear-gradient(165deg,#16383d 0%,#193541 52%,#202e40 100%);box-shadow:8px 0 32px #143c3310}

.nav-icon{display:grid;place-items:center;width:34px;height:34px;flex:none;border-radius:11px;color:#a8c6c0;background:#ffffff0b;transition:background .2s,color .2s,transform .2s}

.nav-icon svg,.module-icon svg,.metric-icon svg{display:block}
.nav-number{margin-left:auto;width:23px;height:23px;border:1px solid #ffffff16;background:#ffffff0a;color:#c3d0ca;border-radius:8px;font-size:10px}
.topbar{position:sticky;top:0;z-index:4;min-height:82px;padding:14px clamp(22px,4vw,60px);background:#ffffffeb;border-bottom-color:#e6eeeb;box-shadow:0 5px 22px #19343a08}

.notice{padding:9px clamp(22px,4vw,60px);font-size:11px;color:#725b37;background:linear-gradient(90deg,#fbf5e9,#fffaf1);border-bottom-color:#f0e5d1}
.main-content{max-width:1500px;padding:32px clamp(22px,4vw,60px) 72px}
.module-intro{display:flex;align-items:center;gap:19px;position:relative;overflow:hidden;padding:24px 26px;margin:0 0 23px;border:1px solid #dfece7;border-radius:20px;background:linear-gradient(115deg,#fff 5%,#f2f8f5 67%,#e8f3ef);box-shadow:0 10px 28px #163a3210;animation:rise-in .4s ease both}

.row{gap:17px}.field-grid{gap:7px 15px}.field-grid.three{gap:7px 14px}

.high,.medium,.low{font-weight:650}.cal{gap:5px}.cal div{padding:8px 4px;border:1px solid #edf1ef;border-radius:9px;background:#fafcfb}.cal .A{border-color:#d4e9e0;background:#e8f5ef;color:#22634d}.cal .B{border-color:#f0e2c7;background:#fcf3e3;color:#7a5925}

async function api(path,opt={}){
  if(opt.body&&!(opt.body instanceof FormData)){opt.headers={'Content-Type':'application/json'};opt.body=JSON.stringify(opt.body)}
  const r=await fetch('/api'+path,opt); if(!r.ok){let t=await r.text();throw new Error(r.status+' '+t)}
  return (r.headers.get('content-type')||'').includes('json')?r.json():r;
}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

  <div id=optOut></div></div>`,

  <div class=field-grid three><div><label>Child’s name</label><input id=childName value="Aarav"></div><div><label>Child’s age</label><input id=childAge type=number min=0 max=18 value=6></div><div><label>Travel distance between homes (km)</label><input id=distanceKm type=number min=0 value=12></div>

  <div class=row><div class=availability><strong>Parent A · generally available days</strong><div class=check-row id=availabilityA>${[['Mon',0],['Tue',1],['Wed',2],['Thu',3],['Fri',4],['Sat',5],['Sun',6]].map(([d,n])=>`<label><input type=checkbox value=${n} checked>${d}</label>`).join('')}</div></div>

   <div class=bid-issue><h4>One-time asset payment (₹)</h4><div class=field-grid three><div><label>Preferred amount</label><input id=bid-B-payout-ideal type=number min=0 value=5000000></div><div><label>Minimum amount</label><input id=bid-B-payout-reservation type=number min=0 value=2500000></div><div><label>Importance (1–10)</label><input id=bid-B-payout-weight type=number min=1 max=10 value=9></div></div></div>
   <button class=go onclick="bid('B')">Submit B’s private bid</button></div></div>

const MODULES={
 doc:{number:1,title:'Legal Document Generator',sub:'Intake, research and advocate-reviewed legal drafts in one workspace.',nav:'Legal documents'},
 med:{number:2,title:'Mediation Copilot',sub:'Support constructive dialogue with private mediator insights and settlement options.',nav:'Mediation copilot'},
 cust:{number:3,title:'Custody Modeler',sub:'Explore practical parenting schedules with the child’s welfare at the center.',nav:'Custody modeler'},
 anal:{number:4,title:'Predictive Analytics',sub:'Review illustrative financial ranges and compare settlement scenarios.',nav:'Predictive analytics'},

function show(k){
 const module=MODULES[k];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));
 const mobileTitles={doc:'Legal Documents',med:'Mediation',cust:'Custody Planner',anal:'Scenario Planner',disp:'Dispute Architect'};
 $('#pageTitle').textContent=window.matchMedia('(max-width:680px)').matches?mobileTitles[k]:module.title;$('#pageSub').textContent=module.sub;
 $('#main').innerHTML=`<section class=module-intro><div class=module-icon>${icon(k,26)}</div><div class=module-copy><span class=eyebrow>Module ${module.number} · Workspace</span><h2>${module.title}</h2><p>${module.sub}</p></div><span class=workspace-pill>DEMO WORKSPACE</span></section>`+TABS[k]();
 if(k=='doc')initDraft();if(k=='med')initMed();if(k=='doc'&&CASE)renderCase()
}

const numericValue=id=>$('#'+id).value===''?undefined:Number($('#'+id).value);
const money=value=>value==null?'Not provided':'₹'+Number(value).toLocaleString('en-IN');
function collectCaseFacts(){
 const petitioner={name:$('#petitionerName').value.trim(),occupation:$('#petitionerOccupation').value.trim(),monthly_income:numericValue('petitionerIncome')};
 const respondent={name:$('#respondentName').value.trim(),occupation:$('#respondentOccupation').value.trim(),monthly_income:numericValue('respondentIncome')};
 const childName=$('#caseChildName').value.trim(),childAge=numericValue('caseChildAge'),assetValue=numericValue('caseAssets'),liabilityValue=numericValue('caseLiabilities');
 return {petitioner,respondent,marriage:{date:$('#marriageDate').value,place:$('#marriagePlace').value.trim(),personal_law:$('#personalLaw').value},
  separation_date:$('#separationDate').value,children:childName?[{name:childName,...(childAge===undefined?{}:{age:childAge})}]:[],
  assets:assetValue?[{name:'Matrimonial assets',value:assetValue,owner:'joint',kind:'matrimonial'}]:[],
  liabilities:liabilityValue?[{name:'Liabilities',amount:liabilityValue}]:[],
  jurisdiction:{city:$('#caseCity').value.trim(),state:$('#caseState').value.trim(),court:$('#caseCourt').value.trim()},
  existing_orders:[],dispute_summary:$('#disputeSummary').value.trim()};
}
function renderFacts(facts){
 const petitioner=facts.petitioner||{},respondent=facts.respondent||{},marriage=facts.marriage||{},jurisdiction=facts.jurisdiction||{};
 const children=facts.children||[],assets=facts.assets||[],liabilities=facts.liabilities||[];
 const assetTotal=assets.reduce((sum,item)=>sum+Number(item.value||0),0),liabilityTotal=liabilities.reduce((sum,item)=>sum+Number(item.amount||0),0);
 const items=[
  ['Petitioner',`${petitioner.name||'Not provided'}${petitioner.occupation?' · '+petitioner.occupation:''} · ${money(petitioner.monthly_income)}`],
  ['Respondent',`${respondent.name||'Not provided'}${respondent.occupation?' · '+respondent.occupation:''} · ${money(respondent.monthly_income)}`],
  ['Marriage',`${marriage.date||'Date not provided'}${marriage.place?' · '+marriage.place:''}`],
  ['Separation',facts.separation_date||'Not provided'],
  ['Children',children.map(child=>`${child.name||'Child'}${child.age==null?'':`, age ${child.age}`}`).join('; ')||'None listed'],
  ['Assets',money(assetTotal)],['Liabilities',money(liabilityTotal)],
  ['Court',jurisdiction.court||jurisdiction.city||'Not provided']
 ];
 if(facts.dispute_summary)items.push(['Case summary',facts.dispute_summary]);
 return `<div class=fact-list>${items.map(([label,value])=>`<div class=fact-item><strong>${esc(label)}</strong><span>${esc(value)}</span></div>`).join('')}</div>`;
}

let WS=[];
async function initMed(){
  if(!SID){const s=await api('/mediation/sessions',{method:'POST',body:{case_id:CASE?.id,issues:["custody schedule","monthly maintenance","flat ownership"]}});SID=s.session_id}
  WS.forEach(w=>w.close());const proto=location.protocol=='https:'?'wss':'ws';
  const mk=(q,fn)=>{const w=new WebSocket(`${proto}://${location.host}/api/ws/mediation/${SID}?${q}`);w.onmessage=e=>fn(JSON.parse(e.data));return w};
  const pc=$('#pchat'),mc=$('#mchat');
  const wp=mk('role=party&party=A',m=>{if(m.type=='message'){pc.innerHTML+=`<div class=msg><b>${m.party}:</b> ${esc(m.text)}</div>`;pc.scrollTop=1e9}});
  const wm=mk('role=mediator',m=>{if(m.type=='analysis'){const a=m.analysis;mc.innerHTML+=`<div class="msg esc${a.escalation}"><b>${m.party}</b>: ${esc(m.text)}<br>
   <small>sentiment ${a.sentiment} · ${esc(a.emotion)} · escalation ${a.escalation} ${a.flags.map(f=>`<span class="tag high">${f}</span>`).join('')}</small><br>
   <b>Rephrase:</b> ${esc(a.rephrase)}<br><i>${esc(a.mediator_prompt)}</i></div>`;mc.scrollTop=1e9}});
  WS=[wp,wm];
}
function sendMsg(){const t=$('#ptext').value.trim();if(!t)return;WS[0].send(JSON.stringify({party:$('#who').value,text:t}));$('#ptext').value=''}
async function medOptions(){await run('optOut',async()=>{const r=await api(`/mediation/sessions/${SID}/options`,{method:'POST'});out('optOut',r.options.map(o=>`<div class=card><b>${esc(o.title)}</b><br>${esc(o.summary)}<br><small>A: ${esc(o.gives_A)} · B: ${esc(o.gives_B)} · Risks: ${esc(o.risks)}</small></div>`).join(''))})()}

 parent_a:{name:$('#parentA').value,role:'parent',available_days:availableDays('availabilityA')},parent_b:{name:$('#parentB').value,role:'parent',available_days:availableDays('availabilityB')},
 distance_km:Number($('#distanceKm').value),proposed_primary:$('#primaryParent').value,preferred_pattern:''};if(CASE)inp.case_id=CASE.id;const p=await api('/custody/plan',{method:'POST',body:inp});PID=p.id;
 const first=p.calendar[0].weekday;const pad=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(first);
 out('custOut',`<h3>Recommended: ${esc(p.chosen.label)} <span class=tag>score ${p.chosen.score}</span> <span class=tag>other parent ${p.chosen.secondary_share_pct}% of nights</span></h3>${p.note?`<div class=medium>${esc(p.note)}</div>`:''}
 <div class=cal>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<div><b>${d}</b></div>`).join('')}${p.calendar.map(d=>`<div class=${d.with} title="${d.date}">${d.date.slice(5)}<br>${d.with}</div>`).join('')}</div>
 <h3>Welfare notes</h3>${p.welfare_notes.map(w=>`<div>• ${esc(w)}</div>`).join('')}
 <h3>Alternatives</h3>${p.alternatives.map(a=>`<div>${a.feasible?'✔':'✖'} ${esc(a.label)} - ${a.score} ${a.infeasible_reason?'('+esc(a.infeasible_reason)+')':''}</div>`).join('')}
 <h3>Agreement</h3><div class=legal-document>${esc(p.agreement_text)}</div><a class=alt style="padding:8px 14px;border:1px solid var(--bd);border-radius:6px;color:var(--ink);text-decoration:none" href="/api/custody/${p.id}/export">Download .docx</a>`)})()}

const hist=(h,cls)=>{const max=Math.max(1,...h.counts);return `<div class="bars ${cls}" role="img" aria-label="Distribution of simulated settlement values">${h.counts.map((c,i)=>`<i style="height:${Math.max(3,c/max*100)}%" title="Range ${i+1}: ${c} scenarios"></i>`).join('')}</div><div class=chart-legend><span class=legend-item><i class="legend-dot ${cls==='b'?'gold':''}"></i>Simulated outcomes</span><span class=legend-item>Distribution range</span></div><div class=chart-stats><span>P10 <strong>${money(h.p10)}</strong></span><span>Median <strong>${money(h.p50)}</strong></span><span>P90 <strong>${money(h.p90)}</strong></span></div>`};
async function predict(){await run('aout',async()=>{const body={monthly_income_payer:Number($('#incomePayer').value),monthly_income_payee:Number($('#incomePayee').value),
 monthly_expenses_payee:Number($('#expensesPayee').value),marriage_years:Number($('#marriageYears').value),children_count:Number($('#childrenCount').value),
 payee_has_custody:$('#hasCustody').checked,payee_homemaker:$('#homemaker').checked,
 assets:[{name:'Matrimonial assets',value:Number($('#assetsValue').value),kind:'matrimonial'}],
 liabilities:[{name:'Liabilities',amount:Number($('#liabilitiesValue').value)}]};
 const r=await api('/analytics/predict',{method:'POST',body});const h=r.heuristic,m=h.maintenance_monthly;
 const probability=Math.max(0,Math.min(100,Number(r.scenarios.prob_negotiated_beats_litigated)*100||0)),timeline=h.timeline_months;
 const monthRange=range=>`${range[0]}–${range[1]} mo`;
 out('aout',`<div class=analytics-kpis>
  <div class="metric-card maintenance"><div class=metric-head><span>Monthly maintenance</span><span class=metric-icon>${icon('maintenance',17)}</span></div><strong class=metric-value>${money(m.mid)}</strong><span class=metric-note>Illustrative range ${money(m.low)}–${money(m.high)}</span></div>
  <div class="metric-card settlement"><div class=metric-head><span>Negotiated settlement</span><span class=metric-icon>${icon('networth',17)}</span></div><strong class=metric-value>${money(r.scenarios.negotiated.p50)}</strong><span class=metric-note>Estimated median present value</span></div>
  <div class="metric-card probability"><div class=metric-head><span>Settlement likelihood</span><span class=metric-icon>${icon('probability',17)}</span></div><strong class=metric-value>${probability.toFixed(0)}%</strong><span class=metric-note>Negotiated value ≥ litigated estimate</span></div>
  <div class="metric-card assetshare"><div class=metric-head><span>Payee asset share</span><span class=metric-icon>${icon('networth',17)}</span></div><strong class=metric-value>${h.payee_asset_share_pct.low}–${h.payee_asset_share_pct.high}%</strong><span class=metric-note>Illustrative share of matrimonial assets</span></div>
  <div class="metric-card networth"><div class=metric-head><span>Estimated net worth</span><span class=metric-icon>${icon('networth',17)}</span></div><strong class=metric-value>${money(r.disclosure.net_worth)}</strong><span class=metric-note>Assets less reported liabilities</span></div>
  <div class="metric-card timeline"><div class=metric-head><span>Contested timeline</span><span class=metric-icon>${icon('timeline',17)}</span></div><strong class=metric-value>${monthRange(timeline.contested)}</strong><span class=metric-note>Illustrative months to resolution</span></div>
 </div>
 <div class=card><div class=chart-title><div><h3>Resolution timeline</h3><p>Indicative duration by path · not a court-service guarantee</p></div><span class=tag>MONTHS</span></div>
  <div class=timeline-grid><div class="timeline-card recommended"><span>Mutual consent</span><strong>${monthRange(timeline.mutual_consent)}</strong><small>Direct agreement</small></div><div class=timeline-card><span>Negotiated mediation</span><strong>${monthRange(timeline.negotiated_mediation)}</strong><small>Structured settlement</small></div><div class=timeline-card><span>Contested proceedings</span><strong>${monthRange(timeline.contested)}</strong><small>Litigated pathway</small></div></div>
 </div>
 ${r.disclosure.missing_sections.length?`<div class="analytics-note high"><strong>Disclosure needs attention</strong><br>Missing sections: ${r.disclosure.missing_sections.map(esc).join(', ')}</div>`:''}
 <div class=chart-grid><section class=chart-card><div class=chart-title><div><h3 class="scenario-title">Litigated estimate</h3><p>Present-value outcomes for the payee</p></div><span class=tag>MODEL RANGE</span></div>${hist(r.scenarios.litigated,'')}</section>
 <section class=chart-card><div class=chart-title><div><h3 class="scenario-title gold">Negotiated estimate</h3><p>Present-value outcomes for the payee</p></div><span class=tag>MODEL RANGE</span></div>${hist(r.scenarios.negotiated,'b')}</section></div>
 <div class=probability-row><strong>Chance negotiated value meets or exceeds litigated</strong><div class=probability-track role=img aria-label="${probability.toFixed(0)} percent estimated probability"><span style="--probability:${probability}%"></span></div><span class=probability-value>${probability.toFixed(0)}%</span></div>
 <div class=analytics-note>${esc(r.narrative)}<br><small>Source: ${esc(r.data_source)} · ${esc(r.ai_mode)} · Illustrative analysis, not legal advice or a prediction of a court decision.</small></div>`)})()}
async function tradeoff(){await run('tout',async()=>{const r=await api('/analytics/tradeoff',{method:'POST',body:{
 asset_value_given_up:Number($('#tradeAsset').value),current_monthly:Number($('#tradeMonthly').value),horizon_months:Number($('#tradeHorizon').value)}});
 out('tout',`<div class=tradeoff-kpis><div class=tradeoff-kpi><span>One-time asset value</span><strong>${money(Number($('#tradeAsset').value))}</strong></div><div class=tradeoff-kpi><span>Equivalent monthly reduction</span><strong>${money(r.equivalent_monthly_reduction)}</strong></div><div class=tradeoff-kpi><span>Adjusted monthly amount</span><strong>${money(r.new_monthly)}</strong></div></div><p class=analytics-note>${esc(r.note)}</p>`)})()}

async function triage(){await run('triOut',async()=>{const r=await api('/dispute/triage',{method:'POST',body:{text:$('#tri').value}});
 out('triOut',`<h3 class=${r.route=='emergency_court'?'high':'low'}>Route: ${r.route} (urgency ${r.urgency}/5)</h3>${(r.reasons||[]).map(x=>`<div>• ${esc(x)}</div>`).join('')}<h3>Steps</h3>${(r.recommended_steps||[]).map(x=>`<div>→ ${esc(x)}</div>`).join('')}${r.helplines?`<h3>Helplines</h3>${Object.entries(r.helplines).map(([k,v])=>`<span class=tag>${k}: <b>${v}</b></span>`).join('')}`:''}`)})()}
function updateNegotiationControls(){const agreed=Object.values(NRESULT||{}).some(v=>v.status==='agreed');$('#agreementBtn').disabled=!agreed;$('#nextRoundBtn').hidden=!NRESULT||agreed}
async function mkNeg(){await run('negOut',async()=>{const n=await api('/dispute/negotiations',{method:'POST',body:{case_id:CASE?.id,issues:[{key:'maintenance',label:'Monthly maintenance (₹)'},{key:'payout',label:'One-time asset payout (₹)'}]}});NID=n.negotiation_id;NRESULT=null;$('#negId').textContent=NID;$('#agOut').innerHTML='';updateNegotiationControls();out('negOut','<i>Negotiation started. Submit both parties’ bids to see which issues overlap.</i>')})()}
async function bid(p){await run('negOut',async()=>{if(!NID)throw new Error('Click "Start negotiation" first');const bids={},weights={};for(const key of ['maintenance','payout']){
 const ideal=$(`#bid-${p}-${key}-ideal`).valueAsNumber,reservation=$(`#bid-${p}-${key}-reservation`).valueAsNumber,weight=$(`#bid-${p}-${key}-weight`).valueAsNumber;
 if(!Number.isFinite(ideal)||!Number.isFinite(reservation)||!Number.isFinite(weight))throw new Error('Enter both amounts and an importance rating for each issue.');
 if(weight<1||weight>10)throw new Error('Importance ratings must be between 1 and 10.');
 if(p==='A'&&ideal>reservation)throw new Error('Party A’s preferred amount must be no greater than the maximum amount.');
 if(p==='B'&&ideal<reservation)throw new Error('Party B’s preferred amount must be at least the minimum amount.');
 bids[key]={ideal,reservation};weights[key]=weight;
 }
 const r=await api(`/dispute/negotiations/${NID}/bid`,{method:'POST',body:{party:p,bids,weights}});
 NRESULT=r.results||null;updateNegotiationControls();
 const results=r.results?Object.entries(r.results).map(([k,v])=>`<div class=card><b>${k==='maintenance'?'Monthly maintenance':'One-time asset payment'}</b>: <span class=${v.status=='agreed'?'low':'medium'}>${v.status}</span> ${v.value!==undefined?'→ proposed ₹'+v.value.toLocaleString('en-IN'):''} ${v.gap_band?'· gap '+v.gap_band:''}<br><small>${esc(v.message||'')}</small></div>`).join(''):'';
 const guidance=r.results?(Object.values(r.results).some(v=>v.status==='agreed')?'<p>At least one issue is agreed. You can draft an agreement using the agreed terms.</p>':'<p>No issues overlap yet. Review both parties’ own positions, then start another round to submit revised bids.</p>'):'<p>Waiting for the other party to submit a bid. No private amounts are shown here.</p>';
 out('negOut',`<div>Round ${r.round}: Party A ${r.submitted.A?'submitted ✔':'pending'} · Party B ${r.submitted.B?'submitted ✔':'pending'}</div>${results}${guidance}`)})()}
async function nextNegotiationRound(){await run('negOut',async()=>{if(!NID)throw new Error('Start a negotiation first.');const r=await api(`/dispute/negotiations/${NID}/next-round`,{method:'POST'});NRESULT=null;$('#agOut').innerHTML='';updateNegotiationControls();out('negOut',`<p>Round ${r.round} started. Both parties can now submit revised bids. Your amount fields are unchanged.</p>`)})()}
async function mkAgreement(){await run('agOut',async()=>{if(!NID)throw new Error('Start a negotiation first.');if(!Object.values(NRESULT||{}).some(v=>v.status==='agreed'))throw new Error('An agreement can only be drafted after both bids are submitted and at least one issue is agreed.');const d=await api(`/dispute/negotiations/${NID}/agreement`,{method:'POST'});out('agOut',`<div class=legal-document>${esc(d.text)}</div><a class=alt href="/api/drafts/${d.id}/export">Download .docx</a>`)})()}
async function addEv(){await run('evOut',async()=>{need();const f=new FormData();f.append('kind',$('#ek').value);f.append('date',$('#ed').value);f.append('source',$('#es').value);f.append('text',$('#et').value);if($('#ef').files[0])f.append('file',$('#ef').files[0]);await api(`/cases/${CASE.id}/evidence`,{method:'POST',body:f});bundle()})()}
async function bundle(){await run('evOut',async()=>{need();$('#bx').href=`/api/cases/${CASE.id}/evidence/bundle/export`;const b=await api(`/cases/${CASE.id}/evidence/bundle`);out('evOut',b.map(r=>`<div class=card><b>${r.exhibit}</b> · ${r.date||'undated'} · ${r.kind} ${(r.tags||[]).map(t=>`<span class=tag>${t}</span>`).join('')} rel ${r.relevance}/5<br>${esc(r.summary)}</div>`).join('')||'<i>No evidence yet.</i>')})()}
async function brief(){await run('evOut',async()=>{need();const r=await api(`/cases/${CASE.id}/hearing-brief`,{method:'POST',body:{}});out('evOut',`<h3>Argument brief</h3><div>${esc(r.argument_brief)}</div><h3>Cross-examination pointers</h3>${(r.cross_examination_pointers||[]).map(c=>`<div class=card><b>${esc(c.topic)}</b> ${(c.exhibit_refs||[]).map(e=>`<span class=tag>${esc(e)}</span>`).join('')}<br>${(c.questions||[]).map(q=>`<div>? ${esc(q)}</div>`).join('')}</div>`).join('')}<h3>Weak points</h3>${(r.weak_points||[]).map(w=>`<div>• ${esc(w)}</div>`).join('')}`)})()}

api('/health').then(h=>{$('#mode').textContent=h.ai_mode=='gemini'?'AI: Gemini':'AI: Offline demo';$('#disc').textContent=h.disclaimer});
show('doc');
</script></body></html>
